name: Rust CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-rules-and-test:
    name: Check Rust Rules & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Enforce Codebase Rules (Line Limits)
        run: |
          echo "Checking file line limits (< 400 lines)..."
          find src -name '*.rs' | xargs wc -l | grep -v 'total$' | awk '$1 > 400 {print "❌ File exceeds limit: " $0; found=1} END {exit found}'
          echo "✔ All files passed line limits gate."

      - name: Check Formatting (cargo fmt)
        run: cargo fmt --check

      - name: Check Clippy Lints (zero warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Tests
        run: cargo test --all-targets --all-features

      - name: Verify Zero Build Warnings
        run: |
          cargo build 2>&1 | tee build.log
          if grep -q "warning:" build.log; then
            echo "❌ Build produced warnings!"
            exit 1
          fi

  build-binary:
    name: Build & Package Binary
    needs: check-rules-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        run: |
          cargo build --release --locked
          strip target/release/omarchy-dotfiles

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-dotfiles-linux-x86_64
          path: target/release/omarchy-dotfiles
          if-no-files-found: error

      - name: Release to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/omarchy-dotfiles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
