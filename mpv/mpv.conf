# mpv IPC socket for sys-chronicle scrobbling & telemetry
input-ipc-server=/tmp/mpvsocket

# Audio / subtitle language priorities
alang=jpn,jp,ja,japanese
slang=enm,eng,en
sub-auto=fuzzy

# Resume playback where left off
save-position-on-quit=yes

# GPU rendering & hardware decoding
vo=gpu-next
gpu-api=auto
hwdec=auto-safe

# >>> anime4k-managed-start >>>
# Optimized shaders for lower-end GPU (Fast): Mode C+A
glsl-shaders="~~/shaders/Anime4K_Clamp_Highlights.glsl:~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_M.glsl:~~/shaders/Anime4K_AutoDownscalePre_x2.glsl:~~/shaders/Anime4K_AutoDownscalePre_x4.glsl:~~/shaders/Anime4K_Restore_CNN_S.glsl:~~/shaders/Anime4K_Upscale_CNN_x2_S.glsl"
# <<< anime4k-managed-end <<<
ytdl-format=bestvideo[height<=?1080]+bestaudio/best
